name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit dependency tree
        run: |
          npm audit --json > audit-report.json || true
          node -e "const a=require('./audit-report.json'); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(n + ': ' + v.severity + '; range=' + v.range + '; via=' + v.via.map(x => typeof x === 'string' ? x : x.title + ' (' + x.range + ')').join(' | ') + '; fix=' + JSON.stringify(v.fixAvailable))"
      - run: npm test
      - run: npm run build